<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>باکس‌شو | اتصال کریتورها و برندها برای بررسی محصول</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
  :root{
    --ink-900:#1B2A4A;
    --ink-700:#48506B;
    --ink-400:#8A90A6;
    --accent-a:#C9762E;
    --accent-b:#1E7D68;
    --glass-bg:rgba(255,255,255,0.42);
    --glass-bg-strong:rgba(255,255,255,0.62);
    --glass-border:rgba(255,255,255,0.75);
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  html, body{
    height:100%;
    overflow:hidden;
    font-family:'Vazirmatn', Tahoma, sans-serif;
    color:var(--ink-900);
  }

  /* ===== colorful blurred mesh backdrop — this is what the glass blurs ===== */
  .stage{
    position:relative;
    width:100vw;
    height:100vh;
    height:100dvh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:3vh 3vw;
    background:
      radial-gradient(circle at 12% 18%, rgba(90,140,255,0.55), transparent 42%),
      radial-gradient(circle at 88% 12%, rgba(255,110,160,0.50), transparent 42%),
      radial-gradient(circle at 82% 88%, rgba(255,185,70,0.48), transparent 42%),
      radial-gradient(circle at 15% 85%, rgba(60,210,180,0.45), transparent 42%),
      radial-gradient(circle at 50% 50%, rgba(180,140,255,0.35), transparent 55%),
      #EDEFF3;
  }

  /* ===== ONE big glass panel holding both halves ===== */
  .glass-panel{
    position:relative;
    width:100%;
    height:100%;
    max-width:1200px;
    background:var(--glass-bg);
    -webkit-backdrop-filter:blur(28px) saturate(180%);
    backdrop-filter:blur(28px) saturate(180%);
    border:1px solid var(--glass-border);
    border-radius:clamp(18px, 3vw, 34px);
    box-shadow:0 20px 60px rgba(27,42,74,0.18), inset 0 1px 0 rgba(255,255,255,0.7);
    overflow:hidden;
    display:grid;
    grid-template-columns:1fr 1fr;
  }

  .divider{
    position:absolute;
    left:50%; top:6%; bottom:6%;
    width:1px;
    background:linear-gradient(to bottom, transparent, rgba(27,42,74,0.16) 20%, rgba(27,42,74,0.16) 80%, transparent);
    z-index:1;
  }

  .half{
    position:relative;
    display:flex;
    align-items:center;
    justify-content:center;
    text-align:center;
    padding:4vw;
    z-index:2;
  }

  .num{
    font-size:clamp(10px, 1.6vw, 13px);
    font-weight:700;
    letter-spacing:0.4px;
    margin-bottom:clamp(5px, 1.2vw, 12px);
  }
  .half.left .num{ color:var(--accent-a); }
  .half.right .num{ color:var(--accent-b); }

  h1{
    font-size:clamp(15px, 3vw, 28px);
    font-weight:800;
    line-height:1.35;
  }
  p.lede{
    margin-top:clamp(5px, 1.4vw, 14px);
    font-size:clamp(10.5px, 1.7vw, 15px);
    color:var(--ink-700);
    line-height:1.75;
    max-width:320px;
    margin-left:auto; margin-right:auto;
  }

  .cta{
    margin-top:clamp(12px, 2.6vw, 28px);
    display:inline-flex;
    align-items:center;
    gap:6px;
    padding:clamp(9px, 1.8vw, 15px) clamp(16px, 3vw, 28px);
    border-radius:100px;
    border:1px solid var(--glass-border);
    background:var(--glass-bg-strong);
    -webkit-backdrop-filter:blur(14px) saturate(160%);
    backdrop-filter:blur(14px) saturate(160%);
    font-family:'Vazirmatn', sans-serif;
    font-size:clamp(11px, 1.9vw, 15.5px);
    font-weight:700;
    cursor:pointer;
    box-shadow:0 6px 18px rgba(27,42,74,0.12), inset 0 1px 0 rgba(255,255,255,0.8);
    transition:transform .15s ease;
  }
  .cta:hover{ transform:translateY(-2px); }
  .half.left .cta{ color:var(--accent-a); }
  .half.right .cta{ color:var(--accent-b); }

  /* ===== real box photo — bigger, anchored to the panel's bottom-left corner ===== */
  #box-photo{
    position:absolute;
    left:-2%;
    bottom:-4%;
    width:clamp(140px, 26vw, 380px);
    z-index:3;
    filter:drop-shadow(0 20px 26px rgba(27,42,74,0.30));
    animation:sway 14s ease-in-out infinite;
    pointer-events:none;
  }
  @keyframes sway{
    0%,100%{ transform:rotate(0deg) translateY(0); }
    50%{     transform:rotate(-1deg) translateY(-5px); }
  }
  @media (prefers-reduced-motion: reduce){
    #box-photo{ animation:none; }
  }

  /* ===== modal, also glass ===== */
  .overlay{
    position:fixed; inset:0;
    background:rgba(27,42,74,0.30);
    -webkit-backdrop-filter:blur(4px);
    backdrop-filter:blur(4px);
    display:none;
    align-items:center;
    justify-content:center;
    z-index:20;
    padding:20px;
  }
  .overlay.open{ display:flex; }
  .modal{
    position:relative;
    width:100%;
    max-width:460px;
    max-height:88vh;
    overflow-y:auto;
    background:rgba(255,255,255,0.80);
    -webkit-backdrop-filter:blur(30px) saturate(180%);
    backdrop-filter:blur(30px) saturate(180%);
    border:1px solid var(--glass-border);
    border-radius:22px;
    padding:28px 24px;
    box-shadow:0 30px 60px -20px rgba(27,42,74,0.4);
  }
  .modal .close{
    position:absolute; top:14px; left:14px;
    width:30px; height:30px;
    border:none; border-radius:50%;
    background:rgba(27,42,74,0.08);
    color:var(--ink-700);
    font-size:16px;
    cursor:pointer;
    z-index:2;
  }
  .panel-head{
    display:flex; justify-content:space-between; align-items:flex-start;
    border-bottom:1px solid rgba(27,42,74,0.1);
    padding-bottom:16px; margin-bottom:20px;
  }
  .panel-head h4{ font-size:18px; font-weight:700; }
  .panel-head .stamp{ font-size:11px; font-weight:600; padding:4px 10px; border-radius:6px; border:1px solid currentColor; }
  #form-creator-wrap .stamp{ color:var(--accent-a); }
  #form-brand-wrap .stamp{ color:var(--accent-b); }

  label{ display:block; font-size:13px; font-weight:600; margin-bottom:6px; color:var(--ink-900); }
  .field{ margin-bottom:16px; }
  .field .hint{ font-size:11.5px; color:var(--ink-400); margin-top:4px; }
  input[type=text], input[type=tel], input[type=number], select, textarea{
    width:100%;
    font-family:'Vazirmatn', sans-serif;
    font-size:14.5px;
    padding:11px 13px;
    border:1px solid rgba(27,42,74,0.14);
    border-radius:8px;
    background:rgba(255,255,255,0.7);
    color:var(--ink-900);
    outline:none;
  }
  input:focus, select:focus, textarea:focus{ border-color:var(--ink-400); }
  textarea{ resize:vertical; min-height:60px; }

  /* checkbox groups */
  .check-grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:8px;
  }
  .check-item, .check-row{
    display:flex;
    align-items:center;
    gap:8px;
    font-size:13.5px;
    color:var(--ink-900);
    cursor:pointer;
  }
  .check-item input, .check-row input{
    width:16px; height:16px;
    accent-color:var(--accent-a);
    flex-shrink:0;
    cursor:pointer;
  }
  #form-brand-wrap .check-item input, #form-brand-wrap .check-row input{ accent-color:var(--accent-b); }

  .terms-row{
    display:flex;
    align-items:flex-start;
    gap:10px;
    font-size:12.5px;
    line-height:1.8;
    color:var(--ink-700);
    background:rgba(27,42,74,0.05);
    border-radius:8px;
    padding:12px 13px;
  }
  .terms-row input{
    width:16px; height:16px;
    margin-top:3px;
    accent-color:var(--accent-a);
    flex-shrink:0;
    cursor:pointer;
  }

  #own-page-field{ display:none; margin-top:10px; }

  .submit-btn{
    width:100%;
    padding:13px;
    border:none;
    border-radius:9px;
    font-family:'Vazirmatn', sans-serif;
    font-size:15px;
    font-weight:700;
    color:#fff;
    cursor:pointer;
    margin-top:14px;
  }
  .submit-btn:disabled{ opacity:0.6; cursor:not-allowed; }
  #form-creator-wrap .submit-btn{ background:var(--accent-a); }
  #form-brand-wrap .submit-btn{ background:var(--accent-b); }

  .status-msg{ margin-top:12px; font-size:13.5px; padding:11px 13px; border-radius:8px; display:none; }
  .status-msg.success{ display:block; background:rgba(30,125,104,0.1); color:#1E5A4C; }
  .status-msg.error{ display:block; background:rgba(210,70,50,0.08); color:#B23A22; }

  @media (prefers-reduced-motion: reduce){
    *{ transition:none !important; }
  }
</style>
</head>
<body>

<div class="stage">
  <div class="glass-panel">
    <div class="divider"></div>
    <img id="box-photo" src="box.png" alt="">

    <div class="half left">
      <div>
        <div class="num">۰۱ / کریتور</div>
        <h1>می‌خوام آنباکس کنم</h1>
        <p class="lede">دوست داری محصولات جدید رو بگیری، بررسی کنی و برای فالوورهات معرفی کنی؟</p>
        <button class="cta" onclick="openModal('creator')">ثبت‌نام می‌کنم ←</button>
      </div>
    </div>

    <div class="half right">
      <div>
        <div class="num">۰۲ / برند</div>
        <h1>می‌خوام محصولم بررسی بشه</h1>
        <p class="lede">فروشگاه یا برند داری و می‌خوای محصولت دست یه کریتور مناسب برسه؟</p>
        <button class="cta" onclick="openModal('brand')">ثبت درخواست ←</button>
      </div>
    </div>
  </div>
</div>

<div class="overlay" id="overlay" onclick="if(event.target===this) closeModal()">
  <div class="modal">
    <button class="close" onclick="closeModal()">×</button>

    <div id="form-creator-wrap">
      <div class="panel-head">
        <h4>فرم ثبت‌نام کریتور</h4>
        <span class="stamp">C-FORM</span>
      </div>
      <form id="form-creator" onsubmit="return handleSubmit(event,'creator')">
        <div class="field">
          <label>نام و نام‌خانوادگی</label>
          <input type="text" name="fullName" required>
        </div>
        <div class="field">
          <label>شماره تماس</label>
          <input type="tel" name="contact" required>
        </div>
        <div class="field">
          <label>آدرس</label>
          <textarea name="address" required placeholder="استان، شهر، آدرس کامل پستی"></textarea>
        </div>
        <div class="field">
          <label>کد پستی</label>
          <input type="text" name="postalCode" inputmode="numeric" maxlength="10" required>
        </div>
        <div class="field">
          <label>دسته‌بندی محصولات مورد علاقه <span class="hint" style="font-weight:400">(هرچند تا می‌خوای تیک بزن)</span></label>
          <div class="check-grid">
            <label class="check-item"><input type="checkbox" name="category" value="لوازم آرایشی و بهداشتی"> لوازم آرایشی و بهداشتی</label>
            <label class="check-item"><input type="checkbox" name="category" value="دیجیتال و گجت"> دیجیتال و گجت</label>
            <label class="check-item"><input type="checkbox" name="category" value="خانه و آشپزخانه"> خانه و آشپزخانه</label>
            <label class="check-item"><input type="checkbox" name="category" value="مد و پوشاک"> مد و پوشاک</label>
            <label class="check-item"><input type="checkbox" name="category" value="خوراکی و نوشیدنی"> خوراکی و نوشیدنی</label>
            <label class="check-item"><input type="checkbox" name="category" value="سایر"> سایر</label>
          </div>
        </div>
        <div class="field">
          <label class="check-row">
            <input type="checkbox" id="wants-own-page" onchange="toggleOwnPage(this)">
            آیا تمایل به بارگذاری ویدیو در پیج خودتون دارید؟
          </label>
          <div id="own-page-field">
            <input type="text" name="ownPageLink" placeholder="آیدی یا لینک پیجتون">
          </div>
        </div>
        <div class="field">
          <label class="terms-row">
            <input type="checkbox" name="agreeTerms" required>
            <span>محصولی که دریافت می‌کنید در قبال ساخت ویدیوی معرفی/آنباکسینگ و ارسال آن به ما می‌باشد. ویدیوهای ارسالی شما از تست هر محصول در پیج اینستاگرام «شاپ بازی»، «آذی صبوری» و کانال یوتیوب ما بارگذاری خواهد شد. ارسال ویدیو به معنی تأیید این موارد است.</span>
          </label>
        </div>
        <button type="submit" class="submit-btn">ثبت‌نام می‌کنم</button>
        <div class="status-msg" id="status-creator"></div>
      </form>
    </div>

    <div id="form-brand-wrap" style="display:none">
      <div class="panel-head">
        <h4>فرم درخواست بررسی محصول</h4>
        <span class="stamp">B-FORM</span>
      </div>
      <form id="form-brand" onsubmit="return handleSubmit(event,'brand')">
        <div class="field">
          <label>نام فروشگاه یا برند</label>
          <input type="text" name="brandName" required>
        </div>
        <div class="field">
          <label>آیدی اینستاگرام فروشگاه</label>
          <input type="text" name="instagram" placeholder="@shopname" required>
        </div>
        <div class="field">
          <label>شماره تماس</label>
          <input type="tel" name="contact" required>
        </div>
        <div class="field">
          <label>محصولی که می‌خوای بررسی بشه</label>
          <input type="text" name="product" placeholder="نام محصول یا لینک صفحه‌ش" required>
        </div>
        <div class="field">
          <label>چند تا محصول می‌خوای ارسال کنی؟</label>
          <input type="number" name="productCount" min="1" value="1" required>
        </div>
        <div class="field">
          <label>توضیح کوتاه <span class="hint" style="font-weight:400">(اختیاری)</span></label>
          <textarea name="note" placeholder="مثلاً: محدودیت شهر داری یا نه..."></textarea>
        </div>
        <button type="submit" class="submit-btn">ثبت درخواست</button>
        <div class="status-msg" id="status-brand"></div>
      </form>
    </div>

  </div>
</div>

<script>
  // ====== TODO: این آدرس رو با URL دیپلوی‌شده‌ی Google Apps Script خودت جایگزین کن ======
  const GOOGLE_SCRIPT_URL = "PASTE_YOUR_GOOGLE_APPS_SCRIPT_WEB_APP_URL_HERE";

  function openModal(type){
    document.getElementById('form-creator-wrap').style.display = type === 'creator' ? 'block' : 'none';
    document.getElementById('form-brand-wrap').style.display = type === 'brand' ? 'block' : 'none';
    document.getElementById('overlay').classList.add('open');
  }
  function closeModal(){
    document.getElementById('overlay').classList.remove('open');
  }
  document.addEventListener('keydown', e=>{ if(e.key === 'Escape') closeModal(); });

  function toggleOwnPage(checkbox){
    const field = document.getElementById('own-page-field');
    const input = field.querySelector('input[name="ownPageLink"]');
    if(checkbox.checked){
      field.style.display = 'block';
      input.required = true;
    } else {
      field.style.display = 'none';
      input.required = false;
      input.value = '';
    }
  }

  async function handleSubmit(e, type){
    e.preventDefault();
    const form = e.target;
    const btn = form.querySelector('.submit-btn');
    const statusEl = document.getElementById('status-' + type);
    statusEl.className = 'status-msg';
    statusEl.textContent = '';

    const data = Object.fromEntries(new FormData(form).entries());
    data.type = type;
    data.submittedAt = new Date().toISOString();

    // categories are multiple checkboxes with the same name — collect them properly
    if(type === 'creator'){
      const checked = Array.from(form.querySelectorAll('input[name="category"]:checked')).map(c => c.value);
      data.category = checked.join('، ');
      data.wantsOwnPageUpload = document.getElementById('wants-own-page').checked ? 'بله' : 'خیر';
    }

    if(GOOGLE_SCRIPT_URL.includes('PASTE_YOUR')){
      statusEl.className = 'status-msg error';
      statusEl.textContent = 'هنوز آدرس گوگل‌اسکریپت وصل نشده — راهنمای اتصال رو ببین.';
      return false;
    }

    btn.disabled = true;
    btn.textContent = 'در حال ارسال...';

    try{
      await fetch(GOOGLE_SCRIPT_URL, {
        method: 'POST',
        mode: 'no-cors',
        headers: {'Content-Type':'text/plain'},
        body: JSON.stringify(data)
      });
      statusEl.className = 'status-msg success';
      statusEl.textContent = 'ثبت شد! به‌زودی باهات تماس می‌گیریم.';
      form.reset();
      document.getElementById('own-page-field').style.display = 'none';
      setTimeout(closeModal, 1400);
    }catch(err){
      statusEl.className = 'status-msg error';
      statusEl.textContent = 'یه مشکلی پیش اومد، دوباره امتحان کن.';
    }finally{
      btn.disabled = false;
      btn.textContent = type === 'creator' ? 'ثبت‌نام می‌کنم' : 'ثبت درخواست';
    }
    return false;
  }
</script>

</body>
</html>
